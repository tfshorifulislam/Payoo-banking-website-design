<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==== Google Fonts ==== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- ==== Tailwind & DaisyUI ==== -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ==== Font Awesome ==== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- ==== Css Style ==== -->
    <style>
    *{
        font-family: "Outfit", sans-serif;
    }
    </style>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    
    <title>Payoo | Home</title>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- ==== header section ==== -->
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200">

        <section class="w-11/12 mx-auto flex justify-between items-center py-3 ">

            <!-- === header left container === -->
            <div class="left flex gap-1">

                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="logo.png">
                </div>

                <div class="balance-info">
                    <h2 class="font-bold text-2xl">
                        $ <span id="balance">45000</span>
                    </h2>
                    <p class="text-neutral/50">Available balance</p>
                </div>

            </div>

            <!-- === header right container === -->
            <div class="right">
                <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Log out</a>
            </div>
        </section>
    </header>

    <!-- ==== card button section ==== -->
     <section class="w-11/12 mx-auto space-y-5 py-10">

        <!-- ==== welcome text and description === -->
        <h1 class="font-bold text-3xl ">Welcome to Pay<span class="text-primary">oo</span></h1>
        <p class="text-neutral/50 leading-6">
            Enjoy easy and convenient financial services with us. Cashout charge is low and 
        </p>

        <!-- ==== card information ==== -->
        <div class="card-info grid grid-cols-2 sm:grid-cols-3 gap-3">

            <!-- ==== card-opt-1 -->
            <button onclick="showOnly('add-money')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-1.png" alt="">
                <p class="text-[#080808b3] font-normal">Add Money</p>
            </button>

            <!-- ==== card-opt-2 -->
            <button onclick="showOnly('cashout')" class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-2.png" alt="">
                <p class="text-[#080808b3] font-normal">Cashout</p>
            </button>

            <!-- ==== card-opt-3 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-3.png" alt="">
                <p class="text-[#080808b3] font-normal">Send Money</p>
            </button>

            <!-- ==== card-opt-4 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-4.png" alt="">
                <p class="text-[#080808b3] font-normal">Get Bonus</p>
            </button>

            <!-- ==== card-opt-5 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-5.png" alt="">
                <p class="text-[#080808b3] font-normal">Pay Bill</p>
            </button>

            <!-- ==== card-opt-6 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-6.png" alt="">
                <p class="text-[#080808b3] font-normal">Transactions</p>
            </button>
        </div>
     </section>


     <!-- ==== add money section ==== -->
      <section id="add-money" class="w-11/12 mx-auto py-5">
        <h2 class="text-[#080808e6] font-bold text-[18px] mb-4">
            Add Money
        </h2>

        <!-- ==== Add money form ==== -->

    <div class="card bg-base-100 w-full shadow rounded-3xl">
        <div class="card-body">
            <fieldset class="fieldset">
                <!-- ==== select bank name ==== -->
                <label class="label font-bold text-neutral mb-3 text-neutral/50">Select A Bank</label>
                <select id="select-back" class="select input rounded-full bg-base-200 focus:outline-none mb-4 w-full">
                    <option disabled selected>Select back</option>
                    <option value="DBBL">DBBL</option>
                    <option value="Dhaka Bank">Dhaka bank</option>
                    <option value="City Bank">City Bank</option>
                    <option value="Islami Bank">Islami Bank</option>
                    <option value="EBL">EBL</option>
                </select>

                <!-- ==== Bank Account Number input ==== -->
                <label class="label font-bold text-neutral mb-3 text-neutral/50">Bank Account Number</label>
                <input id="bank-account-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Enter 11 digit account number" />

                <!-- ==== Amount to Add input ==== -->
                <label class="label font-bold text-neutral mb-3 text-neutral/50">Amount to Add</label>
                <input id="add-money-amount"type="text" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Add Amount " />

                <!-- ==== Pin Number input ==== -->
                <label  class="label font-bold text-neutral mb-3 text-neutral/50">Pin Number</label>
                <input id="add-money-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Enter 4 digit pin number" />

                <!-- ==== cash out btn ==== -->
                <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>

            </fieldset>
      </div>
    </div>
    </section>


     <!-- ==== cash out section ==== -->
      <section id="cashout" class="w-11/12 mx-auto py-5">
        <h2 class="text-[#080808e6] font-bold text-[18px] mb-4">
            Cash Out
        </h2>

        <!-- ==== cash out form ==== -->
    <div class="card bg-base-100 w-full shadow rounded-3xl">
        <div class="card-body">
            <fieldset class="fieldset">
                <!-- ==== agent number input ==== -->
                <label class="label font-bold text-neutral mb-3 text-neutral/50">Agent Number</label>
                <input id="cashout-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Enter 11 digit number" />

                <!-- ==== Amount input ==== -->
                <label class="label font-bold text-neutral mb-3 text-neutral/50">Amount</label>
                <input id="cashout-amount"type="text" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Enter amount to withdraw" />

                <!-- ==== Pin input ==== -->
                <label  class="label font-bold text-neutral mb-3 text-neutral/50">Pin Number</label>
                <input id="cashout-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 focus:outline-none mb-4 w-full" placeholder="Enter 4 digit pin number" />

                <!-- ==== cash out btn ==== -->
                <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>

            </fieldset>
      </div>
    </div>
    </section>
    
    <script src="Script/machine.js"></script>
    <script src="Script/add-money.js"></script>
    <script src="Script/cashout.js"></script>
</body>
</html>
