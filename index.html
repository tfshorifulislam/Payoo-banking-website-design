<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==== Google Fonts ==== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- ==== Tailwind & DaisyUI ==== -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ==== Font Awesome ==== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- ==== Css Style ==== -->
    <style>
    *{
        font-family: "Outfit", sans-serif;
    }
    </style>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    
    <title>Payoo | Login</title>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">

    <!-- ==== login page Logo ==== -->
    <div class="mx-auto max-w-[260px] pt-[180px] mb-8">
        <img src="./assets/Logo-full.png" alt="Logo">
    </div>

    <!-- ==== Login Input Form ==== -->
    <section>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label  class="label font-bold text-neutral mb-3">Mobile Number</label>
          <input maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 focus:outline-none mb-4" placeholder="Enter your number" />
          <label  class="label font-bold text-neutral mb-3">4 Digit Pin</label>
          <input maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 focus:outline-none" placeholder="Enter 4 Digit Pin" />
          <button class="btn btn-primary mt-4 rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
     </section>

</body>
</html>
