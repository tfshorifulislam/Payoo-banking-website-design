<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==== Google Fonts ==== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- ==== Tailwind & DaisyUI ==== -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ==== Font Awesome ==== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- ==== Css Style ==== -->
    <style>
    *{
        font-family: "Outfit", sans-serif;
    }
    </style>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    
    <title>Payoo | Home</title>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- === header section === -->
    <header class="border-b-2 border-gray-300">

        <section class="w-11/12 mx-auto flex justify-between items-center py-3 ">

            <!-- === header left container === -->
            <div class="left flex gap-1">

                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="logo.png">
                </div>

                <div class="balance-info">
                    <h2 class="font-bold text-2xl">
                        $ <span id="balance">45000</span>
                    </h2>
                    <p class="text-neutral/50">Available balance</p>
                </div>

            </div>

            <!-- === header right container === -->
            <div class="right">
                <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Log out</a>
            </div>
        </section>
    </header>

    <!-- ==== card button section ==== -->
     <section class="w-11/12 mx-auto space-y-5 py-10">

        <!-- ==== welcome text and description === -->
        <h1 class="font-bold text-3xl ">Welcome to Pay<span class="text-primary">oo</span></h1>
        <p class="text-neutral/50 leading-6">
            Enjoy easy and convenient financial services with us. Cashout charge is low and 
        </p>

        <!-- ==== card information ==== -->
        <div class="card-info grid grid-cols-2 sm:grid-cols-3 gap-3">

            <!-- ==== card-opt-1 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>

            <!-- ==== card-opt-2 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>

            <!-- ==== card-opt-3 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-3.png" alt="">
                <p>Send Money</p>
            </button>

            <!-- ==== card-opt-4 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>

            <!-- ==== card-opt-5 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>

            <!-- ==== card-opt-6 -->
            <button class="btn flex-col h-full py-4 btn-primary btn-soft">
                <img class="w-6" src="./assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
     </section>
</body>
</html>
